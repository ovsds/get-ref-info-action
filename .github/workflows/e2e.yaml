name: E2E

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  e2e-default:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Run
        id: test-run
        uses: $/
        with:
          ref: heads/test_branch

      - name: Assert exists
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.exists }}
          expected: "true"

      - name: Assert ref name
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.ref }}
          expected: "heads/test_branch"

      - name: Assert ref sha
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.sha }}
          expected: "f73a5045ef7ae53c10615128bff2aaefc4594623"

      - name: Assert ref type
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.type }}
          expected: "commit"

  e2e-tag-type:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Run
        id: test-run
        uses: $/
        with:
          ref: tags/test_tag

      - name: Assert exists
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.exists }}
          expected: "true"

      - name: Assert ref name
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.ref }}
          expected: "tags/test_tag"

      - name: Assert ref sha
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.sha }}
          expected: "12e55e326dadd328b71cbf634159cb89337ddd31"

      - name: Assert ref type
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.type }}
          expected: "tag"

  e2e-not-exists:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Run
        id: test-run
        uses: $/
        with:
          ref: tags/not_exists

      - name: Assert exists
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.exists }}
          expected: "false"

      - name: Assert ref name
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.ref }}
          expected: ""

      - name: Assert ref sha
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.sha }}
          expected: ""

      - name: Assert ref type
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.test-run.outputs.type }}
          expected: ""

  e2e:
    runs-on: ubuntu-latest
    if: always() && !cancelled()

    permissions: {}

    needs:
      - e2e-default
      - e2e-tag-type
      - e2e-not-exists

    steps:
      - name: Collect Results
        uses: ovsds/collect-needs-result-action@12190e2a1bfe85d9c024f190a3833973e97998f8 # v1.0.0
        with:
          needs_json: ${{ toJson(needs) }}
          skip_allowed: false
